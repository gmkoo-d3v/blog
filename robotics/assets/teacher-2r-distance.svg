<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 320" width="980" height="320" role="img" aria-labelledby="t2r-title t2r-desc" font-family="Malgun Gothic, 'Apple SD Gothic Neo', sans-serif">
<title id="t2r-title">같은 0.4m·0.3m 팔의 세 자세에서 손끝 좌표와 어깨–손끝 직선거리</title>
<desc id="t2r-desc">왼쪽: 어깨 0도 팔꿈치 0도에서 손끝 (0.7, 0)m, 거리 0.7m. 가운데: 어깨만 90도 돌린 (90, 0)에서 손끝 (0, 0.7)m, 거리는 0.7m로 같고 손끝은 반지름 0.7m인 원 위를 지난다. 오른쪽: 팔꿈치만 90도 굽힌 (0, 90)에서 손끝 (0.4, 0.3)m, 거리는 0.5m로 줄어든다.</desc>
<rect width="980" height="320" fill="#ffffff"/>

