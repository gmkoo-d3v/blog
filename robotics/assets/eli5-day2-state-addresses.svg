<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="t"><title id="t">관절별 qpos와 qvel 칸 수와 시작 주소</title><style>text{font-family:Malgun Gothic,sans-serif;font-size:22px;fill:#203944}.small{font-size:18px}.blue{fill:#2878ac}.orange{fill:#d88330}.axis{stroke:#9eafb9;stroke-width:2}.arm{fill:none;stroke-width:10;stroke-linecap:round}.panel{fill:#f5f8fa;stroke:#d5e0e5;stroke-width:2}</style><rect width="1000" height="340" fill="white"/><text x="30" y="40">같은 관절 순서: 경첩 → 직선 → 구관절 → 자유 관절</text><text x="30" y="100">qpos</text><rect x="140" y="65" width="60" height="60" fill="#2878ac"/><rect x="205" y="65" width="60" height="60" fill="#d88330"/><rect x="270" y="65" width="240" height="60" fill="#d8ebe4"/><rect x="515" y="65" width="420" height="60" fill="#e5eaf7"/><text x="154" y="103" fill="white">0</text><text x="218" y="103">1</text><text x="340" y="103">2…5</text><text x="670" y="103">6…12</text><text x="30" y="210">qvel</text><rect x="140" y="175" width="60" height="60" fill="#2878ac"/><rect x="205" y="175" width="60" height="60" fill="#d88330"/><rect x="270" y="175" width="180" height="60" fill="#d8ebe4"/><rect x="455" y="175" width="360" height="60" fill="#e5eaf7"/><text x="154" y="213">0</text><text x="218" y="213">1</text><text x="316" y="213">2…4</text><text x="600" y="213">5…10</text><text x="30" y="285">같은 자유 관절의 시작: qposadr=6, dofadr=5</text><text x="30" y="320" class="small">색은 같은 관절을 연결합니다. 칸 번호는 0부터 셉니다. nq=13, nv=11.</text></svg>