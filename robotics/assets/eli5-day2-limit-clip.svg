<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="t"><title id="t">어깨 100도 요청을 상한 90도로 제한한 비교</title><style>text{font-family:Malgun Gothic,sans-serif;font-size:22px;fill:#203944}.small{font-size:18px}.blue{fill:#2878ac}.orange{fill:#d88330}.axis{stroke:#9eafb9;stroke-width:2}.arm{fill:none;stroke-width:10;stroke-linecap:round}.panel{fill:#f5f8fa;stroke:#d5e0e5;stroke-width:2}</style><rect width="1000" height="340" fill="white"/><text x="45" y="45">같은 어깨 · 허용 범위 −90°~90°</text><path d="M150 265H375M150 265V80M610 265H835M610 265V80" class="axis"/><path d="M150 265L118.7 87.7" class="arm" stroke="#d88330" stroke-dasharray="12 8"/><path d="M610 265V85" class="arm" stroke="#2878ac"/><text x="220" y="150">요청 100°</text><text x="220" y="190" class="orange">상한 밖</text><text x="700" y="150">clip → 90°</text><text x="700" y="190" class="blue">경계에 붙임</text><text x="45" y="315">clip은 각도 범위를 지킵니다. 손끝이 목표에 남는지는 FK로 다시 확인합니다.</text></svg>