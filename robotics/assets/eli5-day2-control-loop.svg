<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="t"><title id="t">목표각이 힘을 거쳐 실제각과 관찰로 이어지는 한 걸음</title><style>text{font-family:Malgun Gothic,sans-serif;font-size:22px;fill:#203944}.small{font-size:18px}.blue{fill:#2878ac}.orange{fill:#d88330}.axis{stroke:#9eafb9;stroke-width:2}.arm{fill:none;stroke-width:10;stroke-linecap:round}.panel{fill:#f5f8fa;stroke:#d5e0e5;stroke-width:2}</style><rect width="1000" height="360" fill="white"/><rect x="25" y="65" width="225" height="120" rx="12" class="panel"/><rect x="385" y="65" width="230" height="120" rx="12" class="panel"/><rect x="750" y="65" width="225" height="120" rx="12" class="panel"/><path d="M260 125h110M625 125h110" stroke="#267e69" stroke-width="5"/><text x="45" y="105">목표 1rad</text><text x="45" y="145">현재 0.8rad</text><text x="410" y="105">kp=2</text><text x="410" y="145">토크 +0.4N·m</text><text x="770" y="105">step: Δt=.002s</text><text x="770" y="145">새 실제각 q</text><path d="M860 200v55H140v-55" fill="none" stroke="#2878ac" stroke-width="4"/><text x="305" y="290" class="blue">forward → 현재 위치·센서 읽기 → 새 오차</text><text x="30" y="330" class="small">목표각을 넣는 것과 실제각이 즉시 같아지는 것은 별개입니다.</text></svg>